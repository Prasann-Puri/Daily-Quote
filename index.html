<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quotely - Discover, favorite, copy, and share inspiring quotes across multiple categories including motivation, life, success, humor, and favorites.">
  <title>Quotely — Daily Quotes & Inspiration</title>
  
  <!-- Google Fonts for typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Screen Reader Live Announcements -->
    <div id="sr-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- Application Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand">
          <h1 class="app-title">Quotely</h1>
          <p class="app-subtitle">Curated wisdom for daily inspiration</p>
        </div>
        <!-- Theme Toggle Button -->
        <button type="button" class="theme-toggle-btn" id="btn-theme-toggle" aria-label="Switch between light and dark theme" title="Toggle color theme">
          <span class="theme-icon" aria-hidden="true">&#9790;</span>
        </button>
      </div>
    </header>

    <!-- Category Filter Navigation -->
    <nav class="category-nav" aria-label="Quote Categories">
      <div class="category-row">
        <button type="button" class="category-btn active" id="btn-cat-all" data-category="all" aria-label="Filter all quotes">All</button>
        <button type="button" class="category-btn" id="btn-cat-motivation" data-category="motivation" aria-label="Filter motivation quotes">Motivation</button>
        <button type="button" class="category-btn" id="btn-cat-life" data-category="life" aria-label="Filter life quotes">Life</button>
        <button type="button" class="category-btn" id="btn-cat-success" data-category="success" aria-label="Filter success quotes">Success</button>
        <button type="button" class="category-btn" id="btn-cat-humor" data-category="humor" aria-label="Filter humor quotes">Humor</button>
        <button type="button" class="category-btn favorites-tab" id="btn-cat-favorites" data-category="favorites" aria-label="Filter favorite quotes">
          Favorites <span class="fav-count" id="fav-count">(0)</span>
        </button>
      </div>
    </nav>

    <!-- Main Content Area: Quote Display & Actions -->
    <main class="main-content">
      
      <!-- Quote Card Display -->
      <article class="quote-card" id="quote-card">
        <!-- Heart Button on Quote Card to Save Favorite Quotes -->
        <button type="button" class="card-favorite-btn" id="btn-card-favorite" aria-label="Save quote to favorites" aria-pressed="false" title="Save to favorites">
          <svg class="heart-svg" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </button>

        <!-- Optional Decorative Quote Mark -->
        <span class="quote-mark" id="quote-mark" aria-hidden="true">&ldquo;</span>
        
        <blockquote class="quote-body" id="quote-body">
          <p class="quote-text" id="quote-text" aria-live="polite" aria-atomic="true">The only way to do great work is to love what you do.</p>
          <footer class="quote-author-wrapper" id="quote-author-wrapper">
            <cite class="quote-author" id="quote-author">Steve Jobs</cite>
            <span class="quote-badge" id="quote-category-tag">Motivation</span>
          </footer>
        </blockquote>

        <!-- Friendly Empty State View (Shown when Favorites category has no saved quotes) -->
        <div class="empty-favorites-view" id="empty-favorites-view" hidden>
          <div class="empty-icon-wrap" aria-hidden="true">
            <svg class="empty-heart-icon" viewBox="0 0 24 24" width="34" height="34" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </div>
          <h2 class="empty-title">No favorite quotes yet</h2>
          <p class="empty-message">Tap the heart button on any quote you love to save it here for instant inspiration.</p>
          <button type="button" class="empty-browse-btn" id="btn-empty-browse" aria-label="Explore all quotes">
            <span>Explore Quotes</span>
            <span aria-hidden="true">&rarr;</span>
          </button>
        </div>
      </article>

      <!-- Action Buttons Row -->
      <section class="action-buttons-group" aria-label="Quote actions">
        <button type="button" class="action-btn primary-btn" id="btn-new-quote" aria-label="Get a new quote" title="Get a new quote (or press Space / Enter)">
          <span class="btn-icon" aria-hidden="true">&#x21bb;</span>
          <span class="btn-label">New quote</span>
        </button>

        <button type="button" class="action-btn secondary-btn" id="btn-favorite-quote" aria-label="Save quote to favorites" aria-pressed="false" title="Save to favorites">
          <svg class="heart-svg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <span class="btn-label">Favorite</span>
        </button>

        <button type="button" class="action-btn secondary-btn" id="btn-copy-quote" aria-label="Copy quote to clipboard" title="Copy quote to clipboard">
          <span class="btn-icon" aria-hidden="true">&#x2398;</span>
          <span class="btn-label">Copy</span>
        </button>

        <button type="button" class="action-btn secondary-btn" id="btn-share-quote" aria-label="Share this quote" title="Share quote">
          <span class="btn-icon" aria-hidden="true">&#x27A4;</span>
          <span class="btn-label">Share</span>
        </button>
      </section>

    </main>

    <!-- Footer Area -->
    <footer class="app-footer">
      <p>&copy; 2026 Quotely. Crafted for thinkers, dreamers, and doers.</p>
    </footer>

  </div>

  <!-- Application Logic -->
  <script src="script.js" defer></script>
</body>
</html>
